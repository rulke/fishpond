<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>lucky的鱼塘 · 垂钓</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="lineLayer"></div>
  <div id="bobber">
    <div class="tip"></div>
    <div class="body"></div>
    <div id="hookBait" class="hook-bait"></div>
  </div>
  <div id="castGhost" class="cast-ghost"></div>

  <header id="topBar" class="hud">
    <div class="brand">lucky的鱼塘</div>
    <div class="zen" title="静心：不疾不徐，鱼更愿意亲近">
      <span class="zen-label">静心</span>
      <div class="zen-track"><div id="zenFill" class="zen-fill"></div></div>
    </div>
    <div class="top-links">
      <button id="journalBtn" class="text-btn">图鉴</button>
      <button id="helpBtn" class="text-btn">玩法</button>
    </div>
  </header>

  <div id="hint"></div>
  <div id="toast"></div>

  <div id="dock" class="hud">
    <!-- 钓饵 -->
    <div class="bait-row">
      <span class="bait-preview" id="baitPreview"></span>
      <div id="baitBar" class="bait-bar"></div>
    </div>

    <!-- 抛竿：方向 + 能量滑轮 -->
    <div id="castPanel">
      <div class="roller-row">
        <span class="roller-label">方向</span>
        <div class="roller" id="dirRoller" data-role="dir">
          <div class="roller-track"><div class="roller-fill"></div></div>
          <div class="roller-thumb" id="dirThumb"></div>
        </div>
      </div>
      <div class="roller-row">
        <span class="roller-label">能量</span>
        <div class="roller" id="powRoller" data-role="pow">
          <div class="roller-track"><div class="roller-fill" id="powFill"></div></div>
          <div class="roller-thumb" id="powThumb"></div>
        </div>
      </div>
      <button id="castBtn" class="cast-btn">抛竿</button>
    </div>

    <!-- 遛鱼张力 -->
    <div id="tensionWrap">
      <div class="tension-head">
        <span>手感</span>
        <span id="tensionHint">按住收线</span>
      </div>
      <div class="tension-track" id="tensionPad"><div id="tensionFill"></div></div>
    </div>

    <!-- 等待/咬钩时的主操作 -->
    <button id="actionBtn" class="action-btn" hidden></button>
  </div>

  <div id="catchCard" class="card">
    <div id="cardArt"></div>
    <div id="cardRarity">寻常</div>
    <h1 id="cardName">鲫鱼</h1>
    <div id="cardMeta"></div>
    <div id="cardPoem"></div>
    <div class="card-actions">
      <button id="btnRelease">放流</button>
      <button id="btnKeep">收进篓篓</button>
    </div>
  </div>

  <div id="journal">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>鱼鉴</h2>
          <div id="journalStats" class="sub"></div>
        </div>
        <button id="journalClose" class="close-x" aria-label="关闭">×</button>
      </div>
      <div id="journalGrid"></div>
    </div>
  </div>

  <div id="help">
    <div class="panel">
      <div class="panel-head">
        <h2>如何垂钓</h2>
        <button id="helpClose" class="close-x" aria-label="关闭">×</button>
      </div>
      <p>一座只求慢的池塘。不必争抢，鱼来了，便接住。</p>
      <ul>
        <li>拖动<b>方向</b>滑轮选落点，拖动<b>能量</b>滑轮定远近，再按抛竿。</li>
        <li>等待时浮漂会安静；水下试探要<b>忍住</b>，咬钩再扬竿。</li>
        <li>咬钩后按住收线，过紧就松一松；绿色带最省心。</li>
        <li>荷花近旁花运更好；静心越高，奇鱼越易现。</li>
        <li>放流积静心；收进篓篓记斤两，图鉴可回看小诗。</li>
      </ul>
      <p>饵会挂在钩上——红虫引小物，玉米诱肥鱼，花瓣饵结奇缘。</p>
    </div>
  </div>

  <script src="js/bg-data.js"></script>
  <script src="js/water.js"></script>
  <script src="js/life.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
