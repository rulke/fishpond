<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>lucky的鱼塘 · 垂钓</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="lineLayer"></div>
  <svg id="aimFan" class="aim-fan" aria-hidden="true"></svg>
  <div id="aimVeil" aria-hidden="true"></div>
  <div id="bobber" class="float">
    <div class="float-hit"></div>
    <div class="float-tip"></div>
    <div class="float-body"></div>
    <div class="float-foot"></div>
    <div class="float-refl"></div>
    <div id="hookBait" class="hook-bait"></div>
  </div>
  <div id="mistBand" aria-hidden="true"></div>
  <header id="topBar" class="hud">
    <div class="brand">lucky的鱼塘</div>
    <div class="zen" title="静心">
      <span class="zen-label">静心</span>
      <div id="zenBeads" class="zen-beads"></div>
    </div>
    <div class="top-links">
      <button id="journalBtn" class="text-btn">图鉴</button>
      <button id="helpBtn" class="text-btn">玩法</button>
    </div>
  </header>

  <div id="baitTag" aria-hidden="true"></div>

  <div id="dock" class="hud">
    <div class="bait-row">
      <div id="baitBar" class="bait-bar"></div>
    </div>

    <div id="castPanel" class="panel-ice cast-panel-ice">
      <button id="castBtn" class="cast-handle" title="点按抛向池心，或按住水面拖动瞄准">
        <span class="handle-text">抛竿</span>
      </button>
    </div>

    <div id="tensionWrap" class="panel-ice reel-wrap">
      <svg id="reelGauge" viewBox="0 0 96 96" aria-hidden="true">
        <circle class="reel-ring" cx="48" cy="48" r="40"/>
        <path class="reel-safe" d="M18.56 31 A34 34 0 0 1 79.34 34.82"/>
        <path class="reel-danger" d="M18.56 65 A34 34 0 0 1 14.52 53.9"/>
        <path class="reel-danger" d="M81.48 53.9 A34 34 0 0 1 77.44 65"/>
        <line id="reelNeedle" class="reel-needle" x1="48" y1="48" x2="48" y2="20"/>
        <circle class="reel-hub" cx="48" cy="48" r="4.5"/>
      </svg>
    </div>

    <button id="actionBtn" class="action-btn" hidden></button>
  </div>

  <button id="retractBtn" class="retract-btn" hidden>收线</button>

  <div id="catchCard" class="card">
    <div id="cardArt">
      <div class="card-paper"></div>
      <svg id="cardFish" class="card-fish" viewBox="0 0 120 56" aria-hidden="true"></svg>
    </div>
    <div class="card-seals">
      <span class="card-stamp" id="cardRarity">寻常</span>
      <span class="card-badge" id="cardBadge" hidden>初见</span>
    </div>
    <h1 id="cardName">鲫鱼</h1>
    <div id="cardMeta"></div>
    <div id="cardPoem"></div>
    <div class="card-actions">
      <button id="btnRelease" class="btn-ink">放流</button>
      <button id="btnKeep" class="btn-wood">收进篓篓</button>
    </div>
  </div>

  <div id="journal">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>鱼鉴</h2>
          <div id="journalStats" class="sub"></div>
        </div>
        <button id="journalClose" class="close-x" aria-label="关闭">×</button>
      </div>
      <div id="journalGrid"></div>
    </div>
  </div>

  <div id="help">
    <div class="panel">
      <div class="panel-head">
        <h2>如何垂钓</h2>
        <button id="helpClose" class="close-x" aria-label="关闭">×</button>
      </div>
      <p>一座只求慢的池塘。不必争抢，鱼来了，便接住。</p>
      <ul>
        <li><b>按住水面拖动</b>：转扇面定方向，拖远近定力度，松手抛出。</li>
        <li>落点小漂进入亮带是顺风一抛；抛出后<b>别碰水</b>，等鱼靠岸。</li>
        <li>鱼影绕着饵打转是试探——<b>别动它</b>；等浮漂整个没顶，立即点水扬竿。</li>
        <li>咬钩后<b>按住轮盘</b>收线，指针出了青瓷弧就松一松。</li>
        <li>荷花近旁花运更好；静心越高，奇鱼越易现。</li>
        <li>放流积静心；收进篓篓记斤两。</li>
      </ul>
    </div>
  </div>

  <script src="js/bg-data.js"></script>
  <script src="js/water.js"></script>
  <script src="js/life.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/tackle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
