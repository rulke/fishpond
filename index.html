<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>lucky的鱼塘 · 垂钓</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="lineLayer"></div>
  <div id="bobber" class="float">
    <div class="float-tip"></div>
    <div class="float-body"></div>
    <div class="float-foot"></div>
    <div class="float-refl"></div>
    <div id="hookBait" class="hook-bait"></div>
  </div>
  <div id="castGhost" class="cast-ghost"></div>

  <div id="mistBand" aria-hidden="true"></div>
  <header id="topBar" class="hud">
    <div class="brand">lucky的鱼塘</div>
    <div class="zen" title="静心">
      <span class="zen-label">静心</span>
      <svg id="zenLotus" class="zen-lotus" viewBox="0 0 48 28" aria-hidden="true"></svg>
    </div>
    <div class="top-links">
      <button id="journalBtn" class="text-btn">图鉴</button>
      <button id="helpBtn" class="text-btn">玩法</button>
    </div>
  </header>

  <div id="hint"></div>
  <div id="toast"></div>

  <div id="dock" class="hud">
    <div class="bait-row">
      <span class="bait-preview" id="baitPreview"></span>
      <div id="baitBar" class="bait-bar"></div>
    </div>

    <div id="castPanel" class="panel-wood">
      <!-- 竹尺 · 方向 -->
      <div class="roller-row">
        <span class="roller-label">方向</span>
        <div class="roller ruler" id="dirRoller" data-role="dir">
          <div class="ruler-wood"></div>
          <div class="ruler-marks"></div>
          <div class="ruler-fill"></div>
          <div class="roller-thumb wood-thumb" id="dirThumb"></div>
        </div>
      </div>
      <!-- 木轮 · 能量（含甜区） -->
      <div class="roller-row">
        <span class="roller-label">能量</span>
        <div class="roller spool" id="powRoller" data-role="pow">
          <div class="spool-frame"></div>
          <div class="spool-track"><div class="spool-line" id="powFill"></div><div class="sweet-zone" id="sweetZone"></div></div>
          <div class="roller-thumb wood-thumb" id="powThumb"></div>
        </div>
      </div>
      <button id="castBtn" class="cast-handle" title="抛竿">
        <span class="handle-wind"></span>
        <span class="handle-text">抛竿</span>
      </button>
    </div>

    <div id="tensionWrap" class="panel-wood">
      <div class="tension-head">
        <span>手感</span>
        <span id="tensionHint">按住收线</span>
      </div>
      <div class="tension-track" id="tensionPad"><div id="tensionFill"></div></div>
    </div>

    <button id="actionBtn" class="action-btn" hidden></button>
  </div>

  <div id="catchCard" class="card">
    <div id="cardArt">
      <div class="card-paper"></div>
      <svg id="cardFish" class="card-fish" viewBox="0 0 120 56" aria-hidden="true"></svg>
    </div>
    <div class="card-stamp" id="cardRarity">寻常</div>
    <h1 id="cardName">鲫鱼</h1>
    <div id="cardMeta"></div>
    <div id="cardPoem"></div>
    <div class="card-actions">
      <button id="btnRelease" class="btn-ink">放流</button>
      <button id="btnKeep" class="btn-wood">收进篓篓</button>
    </div>
  </div>

  <div id="journal">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>鱼鉴</h2>
          <div id="journalStats" class="sub"></div>
        </div>
        <button id="journalClose" class="close-x" aria-label="关闭">×</button>
      </div>
      <div id="journalGrid"></div>
    </div>
  </div>

  <div id="help">
    <div class="panel">
      <div class="panel-head">
        <h2>如何垂钓</h2>
        <button id="helpClose" class="close-x" aria-label="关闭">×</button>
      </div>
      <p>一座只求慢的池塘。不必争抢，鱼来了，便接住。</p>
      <ul>
        <li>拨<b>竹尺</b>定方向，拨<b>卷线轮</b>蓄远近；落进亮环是「顺风一抛」。</li>
        <li>等待时浮漂会安静；试探只轻点，<b>真口</b>再扬竿。</li>
        <li>咬钩后按住收线，过紧就松一松；绿色带最省心。</li>
        <li>荷花近旁花运更好；静心越高，奇鱼越易现。</li>
        <li>放流积静心；收进篓篓记斤两。</li>
      </ul>
    </div>
  </div>

  <script src="js/bg-data.js"></script>
  <script src="js/water.js"></script>
  <script src="js/life.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/tackle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
