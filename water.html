<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pastel Water</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #cfe8f5;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .flower {
    position: fixed; left: 0; top: 0;
    will-change: transform;
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 2px 3px rgba(60,90,120,.25));
  }
  .pad {
    position: fixed; left: 0; top: 0;
    will-change: transform;
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 2px 3px rgba(40,80,70,.20));
  }
  .petal {
    position: fixed; left: 0; top: 0;
    will-change: transform;
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 1px 2px rgba(60,90,120,.18));
  }
  .koi {
    position: fixed; left: 0; top: 0;
    pointer-events: none;
    z-index: 1;
    opacity: .78;
    filter: blur(1.1px) saturate(.9);
    overflow: visible;
  }
  .koi .tail {
    transform-origin: 30px 74px;
    animation: koiTail var(--td, 1s) ease-in-out infinite alternate;
  }
  .koi .finL {
    transform-origin: 17px 36px;
    animation: koiFin var(--td, 1s) ease-in-out infinite alternate;
    animation-duration: calc(var(--td, 1s) * 1.9);
  }
  .koi .finR {
    transform-origin: 43px 36px;
    animation: koiFinR var(--td, 1s) ease-in-out infinite alternate;
    animation-duration: calc(var(--td, 1s) * 1.9);
  }
  @keyframes koiTail { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  @keyframes koiFin  { from { transform: rotate(-4deg); }  to { transform: rotate(16deg); } }
  @keyframes koiFinR { from { transform: rotate(4deg); }   to { transform: rotate(-16deg); } }
  #hint {
    position: fixed; left: 50%; bottom: 4.5%;
    transform: translateX(-50%);
    z-index: 5;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 8px rgba(70,110,150,.5);
    font-size: 13px; letter-spacing: .35em; text-indent: .35em;
    pointer-events: none;
    opacity: 0; animation: hintIn 2s ease 1s forwards;
    transition: opacity 1.5s ease;
    white-space: nowrap;
  }
  @keyframes hintIn { to { opacity: 1; } }
</style>
</head>

<script>
"use strict";
/* ================= WebGL setup ================= */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { alpha:false, antialias:false, preserveDrawingBuffer:false });
if (!gl) { document.body.innerHTML = "<p style='padding:2em'>WebGL not supported.</p>"; throw new Error("no webgl"); }

// half-float support for the simulation buffer (fallback: 16-bit packed bytes)
const extHF  = gl.getExtension("OES_texture_half_float");
let useHF = false;
if (extHF) {
  // verify renderability
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,4,4,0,gl.RGBA,extHF.HALF_FLOAT_OES,null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  useHF = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(f); gl.deleteTexture(t);
}

const QUAD_VS = `
attribute vec2 p;
varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

// encode/decode helpers shared by shaders (byte fallback packs signed height into RG)
const CODEC = useHF ? `
#define ENC(h) vec4(h,0.,0.,1.)
float DEC(vec4 c){ return c.r; }
` : `
vec4 ENC(float h){
  float v = clamp(h*0.25+0.5, 0., 1.);
  float hi = floor(v*255.)/255.;
  float lo = fract(v*255.);
  return vec4(hi, lo, 0., 1.);
}
float DEC(vec4 c){
  float v = c.r + c.g/255.;
  return (v-0.5)*4.;
}`;

const SIM_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uCur;   // current height
uniform sampler2D uPrev;  // previous height
uniform vec2 uTexel;
uniform vec4 uDrops[8];   // xy pos(uv), z radius(uv), w strength
uniform int uDropCount;
uniform float uDamp;
${CODEC}
void main(){
  float l = DEC(texture2D(uCur, vUv + vec2(-uTexel.x,0.)));
  float r = DEC(texture2D(uCur, vUv + vec2( uTexel.x,0.)));
  float t = DEC(texture2D(uCur, vUv + vec2(0., uTexel.y)));
  float b = DEC(texture2D(uCur, vUv + vec2(0.,-uTexel.y)));
  float prev = DEC(texture2D(uPrev, vUv));
  float h = (l+r+t+b)*0.5 - prev;
  h *= uDamp;
  // add drops (smooth gaussian-ish bumps)
  for (int i = 0; i < 8; i++) {
    if (i >= uDropCount) break;
    vec2 d = vUv - uDrops[i].xy;
    d.x *= uTexel.y/uTexel.x; // aspect-correct in sim space
    float dist = length(d);
    float k = 1.0 - smoothstep(0., uDrops[i].z, dist);
    h += uDrops[i].w * k * k;
  }
  // soft boundary
  vec2 edge = min(vUv, 1.-vUv);
  float wall = smoothstep(0., 0.012, min(edge.x, edge.y));
  h *= wall;
  gl_FragColor = ENC(h);
}`;

const RENDER_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uHeight;
uniform sampler2D uBg;
uniform vec2 uTexel;
uniform vec2 uRes;
uniform vec2 uBgScale;   // cover-fit
uniform float uTime;
${CODEC}
float hAt(vec2 uv){ return DEC(texture2D(uHeight, uv)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  float hl = hAt(vUv + vec2(-uTexel.x,0.));
  float hr = hAt(vUv + vec2( uTexel.x,0.));
  float ht = hAt(vUv + vec2(0., uTexel.y));
  float hb = hAt(vUv + vec2(0.,-uTexel.y));
  vec2 grad = vec2(hr-hl, ht-hb);
  vec3 n = normalize(vec3(-grad.x, -grad.y, 0.14));

  // refraction of background photo
  vec2 bgUv = (vUv-0.5)*uBgScale + 0.5;
  vec2 ruv = bgUv + n.xy * 0.075;
  vec3 col = texture2D(uBg, ruv).rgb;

  // clarity: gentle contrast + saturation lift so the photo reads crisply
  col = (col - 0.5) * 1.08 + 0.5;
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = clamp(mix(vec3(lum), col, 1.22), 0., 1.);

  // pastel water tint — a thin veil so the photo stays the star
  vec3 tintA = vec3(0.78, 0.90, 0.96); // pale aqua
  vec3 tintB = vec3(0.96, 0.86, 0.93); // pale pink
  vec3 tint = mix(tintA, tintB, smoothstep(0., 1., vUv.y*0.8 + 0.1*sin(uTime*0.2)));
  col = mix(col, tint, 0.12);

  // sun sparkle: specular from a high light
  vec3 L = normalize(vec3(0.35, 0.5, 0.8));
  float spec = pow(max(dot(n, L), 0.), 220.);
  // micro-glints: small soft dots, kept away from cell borders so they can't
  // be clipped into squares; only meaningful agitation lights them up
  float agit = clamp(length(grad)*18. - 0.08, 0., 1.);
  agit *= agit;
  vec2 cellUv = vUv*uRes/11.;
  vec2 cell = floor(cellUv);
  float rnd = hash(cell);
  vec2 cpos = 0.3 + 0.4*vec2(hash(cell+1.3), hash(cell+7.7));
  float tw = 0.5 + 0.5*sin(uTime*(3.+rnd*7.) + rnd*40.);
  float glint = smoothstep(0.32, 0., length(fract(cellUv) - cpos));
  float sparkle = glint * step(0.8, rnd) * tw * tw * agit;

  // crest lift folds into the same glow; troughs shade subtly
  float crest = clamp(hAt(vUv)*2.2, -1., 1.);
  float glow = clamp(spec*0.5 + sparkle*0.5 + max(crest, 0.)*0.05, 0., 0.85);
  // screen blend: highlights approach white smoothly, never clip flat
  vec3 glowCol = glow * vec3(1., 0.98, 0.92);
  col = 1.0 - (1.0 - col) * (1.0 - glowCol);
  col -= max(-crest, 0.) * 0.035 * vec3(0.9, 1., 1.);

  // vignette
  vec2 q = vUv - 0.5;
  col *= 1.0 - dot(q,q)*0.22;

  gl_FragColor = vec4(col, 1.);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, QUAD_VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const simProg = program(SIM_FS);
const renProg = program(RENDER_FS);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
function bindQuad(prog){
  const loc = gl.getAttribLocation(prog, "p");
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

/* ============ simulation buffers (ping-pong ×3: prev, cur, next) ============ */
const SIM = Math.min(512, Math.max(256, Math.floor(Math.min(innerWidth, innerHeight) * 0.6)));
let simW = SIM, simH = SIM;
function makeSimTex(){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,simW,simH,0,gl.RGBA,
    useHF ? extHF.HALF_FLOAT_OES : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(useHF ? 0 : 0.5, useHF ? 0 : 0.5, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex: t, fbo: f };
}
let bufPrev = makeSimTex(), bufCur = makeSimTex(), bufNext = makeSimTex();

/* ================= background photo ================= */
const bgTex = gl.createTexture();
let bgW = 1, bgH = 1, bgReady = false;
gl.bindTexture(gl.TEXTURE_2D, bgTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,
  new Uint8Array([200,225,240,255])); // placeholder pale blue
const img = new Image();
img.onload = () => {
  bgW = img.width; bgH = img.height;
  // Draw the photo onto a working canvas so the two loose lily pads can be
  // lifted out (feathered cut + clone-stamp fill). The pad-free result is
  // what the water refracts; the pads come back as floating sprites.
  let src = img;
  try {
    const work = document.createElement("canvas");
    work.width = bgW; work.height = bgH;
    const wx = work.getContext("2d");
    wx.drawImage(img, 0, 0);
    buildPads(work, wx);
    src = work;
  } catch(e) { /* extraction failed: pads stay baked into the photo */ }
  bgReady = true;
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
};
// Prefer the base64 image embedded in this file (works from file:// with no
// server). If this HTML was generated without an embed, fall back to the
// sibling flash1.png — which requires serving the folder over http.
const embedded = window.EMBEDDED_BG || "";
img.src = embedded.startsWith("data:") ? embedded : "flash1.png";

/* ================= resize ================= */
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(innerWidth * DPR);
  H = Math.floor(innerHeight * DPR);
  canvas.width = W; canvas.height = H;
}
addEventListener("resize", resize);
resize();

/* ================= drop queue ================= */
const drops = [];       // for GPU: {x, y, r, s}  (uv coords)
const jsRipples = [];   // for flower sway: {x, y, t0, amp} (css px)
function addDrop(cx, cy, radiusPx, strength){
  const x = cx / innerWidth, y = 1 - cy / innerHeight;
  drops.push({ x, y, r: radiusPx / Math.min(innerWidth, innerHeight), s: strength });
  jsRipples.push({ x: cx, y: cy, t0: performance.now()/1000, amp: strength });
  if (jsRipples.length > 40) jsRipples.shift();
}

/* ================= input ================= */
let lastMove = null;
function onMove(cx, cy){
  if (lastMove) {
    const dx = cx - lastMove.x, dy = cy - lastMove.y;
    const speed = Math.hypot(dx, dy);
    if (speed > 2) {
      const s = Math.min(0.35, 0.05 + speed * 0.006);
      addDrop(cx, cy, 9 + speed * 0.25, s);
    }
  }
  lastMove = { x: cx, y: cy };
}
function bigRipple(cx, cy){

// analytic ripple field at a point (css px) → {h, dx, dy}
const WAVE_SPEED = 260;   // px/s
function rippleField(px, py, now){
  let dx = 0, dy = 0, h = 0;
  for (let i = jsRipples.length - 1; i >= 0; i--){
    const r = jsRipples[i];
    const age = now - r.t0;
    if (age > 4) { continue; }
    const dist = Math.hypot(px - r.x, py - r.y) + 0.001;
    const front = age * WAVE_SPEED;
    const d = dist - front;
    // ring envelope: near the moving wavefront, fading with age & distance
    const env = Math.exp(-(d*d)/(2*55*55)) * Math.exp(-age*1.1) * r.amp;
    if (env < 0.003) continue;
    const wave = Math.sin(d * 0.055) * env;
    h += wave;
    const push = wave * 14 / dist;
    dx += (px - r.x) * push;
    dy += (py - r.y) * push;
  }
  return { h, dx, dy };
}

function updateFlowers(now){
  for (const f of flowers){
    // slow ambient drift
    const bx = f.x + Math.sin(now*f.driftS + f.phase) * f.driftA;
    const by = f.y + Math.cos(now*f.driftS*0.8 + f.phase*1.7) * f.driftA * 0.7;
    const rp = rippleField(bx, by, now);
    const tx = bx + rp.dx;
    const ty = by + rp.dy;
    const bob = 1 + rp.h * 0.10 + Math.sin(now*0.9 + f.phase)*0.015;
    let tilt = f.rot + Math.sin(now*0.5 + f.phase)*f.rotS*3 + rp.dx*0.8;
    // koi swimming underneath gently rock the flower
    for (const kf of kois){
      const dx = bx - kf.x, dy = by - kf.y;
      const d = Math.hypot(dx, dy) + 1;
      const reach = f.size * 0.55 + kf.len * 0.22;
      if (d < reach){
        tilt += (Math.random() - 0.5) * 6 * (kf.cruise + kf.burst) / 50;
      }
    }
    f.el.style.transform =
      `translate(${(tx - f.size/2).toFixed(1)}px, ${(ty - f.size/2).toFixed(1)}px) ` +
      `rotate(${tilt.toFixed(1)}deg) scale(${bob.toFixed(3)})`;
  }
}

/* ============ real lily pads lifted from the photo, set adrift ============ */
// Normalised centres/radii (fraction of photo w/h) of the two pads that sit
// on open water. Everything else (edge clusters, lotus flowers) stays baked in.
const PAD_DEFS = [
  // radii hug the measured leaf; the chroma mask decides the true edge
  { cx:0.4468, cy:0.1830, rx:0.0468, ry:0.0540 }, // upper-middle pad
  { cx:0.7275, cy:0.8361, rx:0.0537, ry:0.0619 }, // lower-right pad
];
const pads = [];  // filled by buildPads(): {el, w, h, x, y, vx, vy, rot, rotV, phase}

// Alpha-mask a pad sprite to the actual leaf: greenness test inside a
// generous ellipse -> dilate to close sparkle holes -> blur for feather.
// Falls back to a feathered ellipse if the leaf isn't detected.
function padChromaMask(ctx, size, rx, ry){
  const n = size*size, c = size/2;
  const d = ctx.getImageData(0, 0, size, size).data;
  let m = new Uint8Array(n), cov = 0;
  for (let i = 0; i < n; i++){
    const px = i % size, py = (i / size)|0;
    const ex = (px-c)/(rx*1.15), ey = (py-c)/(ry*1.15);
    if (ex*ex + ey*ey > 1) continue;
    const r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    // leaf: green dominates; water is cyan-white (blue >= green, all bright)
    if (g > b + 6 && g > r + 10){ m[i] = 255; cov++; }
  }
  if (cov < n*0.04){  // detection failed -> feathered ellipse fallback
    const g0 = ctx.createRadialGradient(c, c, Math.min(rx,ry)*0.75, c, c, Math.max(rx,ry));
    g0.addColorStop(0,"rgba(0,0,0,1)"); g0.addColorStop(0.9,"rgba(0,0,0,1)"); g0.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalCompositeOperation = "destination-in";
    ctx.fillStyle = g0;
    ctx.beginPath(); ctx.ellipse(c, c, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    return;
  }
  // two 3x3 dilation passes: close pinholes from baked sparkles, grow ~2px
  let a = m, b2 = new Uint8Array(n);
  for (let pass = 0; pass < 2; pass++){
    for (let y = 0; y < size; y++){
      const y0 = Math.max(0,y-1), y1 = Math.min(size-1,y+1);
      for (let x = 0; x < size; x++){
        let v = 0;
        const x0 = Math.max(0,x-1), x1 = Math.min(size-1,x+1);
        for (let yy = y0; yy <= y1 && !v; yy++)
          for (let xx = x0; xx <= x1 && !v; xx++)
            if (a[yy*size+xx]) v = 255;
        b2[y*size+x] = v;
      }
    }
    const t = a; a = b2; b2 = t;
  }
  // mask -> alpha channel of a scratch canvas, blurred for a soft feather
  const mc = document.createElement("canvas");
  mc.width = size; mc.height = size;
  const mx = mc.getContext("2d");
  const mid = mx.createImageData(size, size);
  for (let i = 0; i < n; i++) mid.data[i*4+3] = a[i];
  mx.putImageData(mid, 0, 0);
  const fc = document.createElement("canvas");
  fc.width = size; fc.height = size;
  const fx = fc.getContext("2d");
  fx.filter = "blur(2.5px)";       // ignored where unsupported: hard edge, still correct
  fx.drawImage(mc, 0, 0);
  ctx.globalCompositeOperation = "destination-in";
  ctx.drawImage(fc, 0, 0);
  ctx.globalCompositeOperation = "source-over";
}

function buildPads(work, wx){
  const iw = work.width, ih = work.height;
  for (const def of PAD_DEFS){
    const cx = def.cx*iw, cy = def.cy*ih;
    const rx = def.rx*iw, ry = def.ry*ih;
    const pad = Math.ceil(Math.max(rx, ry) * 1.25);
    const size = pad*2;
    // --- 1) cut the pad into a sprite: chroma (greenness) mask hugs the
    //         leaf outline, notch included; ellipse fallback if it fails ---
    const spr = document.createElement("canvas");
    spr.width = size; spr.height = size;
    const sx = spr.getContext("2d", { willReadFrequently: true });
    sx.drawImage(work, cx-pad, cy-pad, size, size, 0, 0, size, size);
    padChromaMask(sx, size, rx, ry);

    // --- 2) heal the hole in the background by clone-stamping nearby water ---
    // blend two clean water patches from opposite sides so the fill keeps the
    // sparkle texture (not a smooth bright blob) and has no directional bias.
    const ang = Math.atan2(ih*0.5 - cy, iw*0.5 - cx);   // toward image centre
    const off = Math.max(rx, ry) * 2.5;
    const ax = cx + Math.cos(ang)*off,        ay = cy + Math.sin(ang)*off;
    const bx = cx + Math.cos(ang+2.2)*off,    by = cy + Math.sin(ang+2.2)*off;
    const hpad = Math.ceil(Math.max(rx, ry) * 1.7);     // heal wider than the pad
    const hsize = hpad*2;
    const heal = document.createElement("canvas");
    heal.width = hsize; heal.height = hsize;
    const hx = heal.getContext("2d");
    hx.filter = "blur(1px)";                  // light: preserve caustic sparkle
    hx.drawImage(work, ax-hpad, ay-hpad, hsize, hsize, 0, 0, hsize, hsize);
    hx.globalAlpha = 0.5;
    hx.drawImage(work, bx-hpad, by-hpad, hsize, hsize, 0, 0, hsize, hsize);
    hx.globalAlpha = 1; hx.filter = "none";
    // nudge the fill slightly darker to offset the clone's averaged brightness
    hx.globalCompositeOperation = "multiply";
    hx.fillStyle = "rgba(232,240,240,1)";
    hx.fillRect(0,0,hsize,hsize);
    hx.globalCompositeOperation = "source-over";
    // wide, soft feather; solid core extends past the leaf so no ghost shows
    const g2 = hx.createRadialGradient(hpad, hpad, 0, hpad, hpad, hpad);
    g2.addColorStop(0, "rgba(0,0,0,1)");
    g2.addColorStop(0.55, "rgba(0,0,0,1)");
    g2.addColorStop(1, "rgba(0,0,0,0)");
    hx.globalCompositeOperation = "destination-in";
    hx.fillStyle = g2;
    hx.fillRect(0,0,hsize,hsize);
    hx.globalCompositeOperation = "source-over";
    wx.drawImage(heal, cx-hpad, cy-hpad);

    // --- 3) register a floating sprite (cover-fit mapping, life size) ---
    const k = Math.max(innerWidth/iw, innerHeight/ih);  // photo px -> css px
    const el = document.createElement("img");
    el.src = spr.toDataURL("image/png");
    el.className = "pad";
    const wCss = size * k;
    el.style.width = wCss + "px";
    el.style.height = wCss + "px";
    document.body.appendChild(el);
    const homeX = innerWidth/2 + (cx - iw/2)*k;
    const homeY = innerHeight/2 + (cy - ih/2)*k;
    pads.push({
      el, w: wCss, h: wCss,
      x: homeX, y: homeY,
      homeX, homeY,
      vx: 0, vy: 0,
      rot: 0, rotV: (Math.random()-.5)*3, rotV0: 0,
      phase: Math.random()*Math.PI*2,
    });
    pads[pads.length-1].rotV0 = pads[pads.length-1].rotV;
  }
}

function updatePads(now, dt){
  for (const p of pads){
    const cur = currentAt(p.x, p.y, now);
    const rp = rippleField(p.x, p.y, now);
    // moored float: the pad hovers over its healed spot, only swaying a little,
    // so the clone-fill never peeks out. Ripples & koi can shove it briefly.
    const k = Math.min(1, dt*0.5);
    p.vx += (cur.x*0.18 - p.vx)*k + rp.dx*dt*7 + (p.homeX - p.x)*dt*0.9;
    p.vy += (cur.y*0.18 - p.vy)*k + rp.dy*dt*7 + (p.homeY - p.y)*dt*0.9;
    // a koi brushing underneath tips the pad and sheds a ripple
    for (const kf of kois){
      const dx = p.x - kf.x, dy = p.y - kf.y;
      const d = Math.hypot(dx, dy);
      const reach = p.w*0.45 + kf.len*0.25;
      if (d > 1 && d < reach){
        const push = (kf.cruise + kf.burst) * (0.3 + kf.big*0.6) * dt / d;
        p.vx += dx*push; p.vy += dy*push;
        p.rotV += (Math.random()-.5)*dt*20;
        if (Math.random() < dt*2)
          addDrop(p.x + dx*0.3, p.y + dy*0.3, 9, 0.05 + kf.big*0.05);
      }
    }
    p.vx *= 0.90; p.vy *= 0.90;
    p.rotV += (p.rotV0 - p.rotV) * Math.min(1, dt*1.2);   // relax spin toward baseline
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += (p.rotV + rp.dx*1.5)*dt;
    const bob = 1 + rp.h*0.05 + Math.sin(now*0.6 + p.phase)*0.01;
    p.el.style.transform =
      `translate(${(p.x - p.w/2).toFixed(1)}px, ${(p.y - p.h/2).toFixed(1)}px) ` +
      `rotate(${(p.rot + Math.sin(now*0.4+p.phase)*3).toFixed(1)}deg) scale(${bob.toFixed(3)})`;
  }
}

function petalSvg(c, uid){

for (let i = 0; i < PETAL_COUNT; i++){

  petals.push({

// gentle ambient surface current (slow swirling flow field, px/s)
function currentAt(x, y, t){
  return {
    x: Math.sin(y*0.0032 + t*0.14 ) * 9 + Math.sin(t*0.05 + x*0.001) * 5,
    y: Math.cos(x*0.0027 + t*0.11) * 7 + Math.cos(t*0.043) * 4,
  };
}
function updatePetals(now, dt){
  const m = 30;
  for (const p of petals){
    const cur = currentAt(p.x, p.y, now);
    const rp = rippleField(p.x, p.y, now);
    // relax toward the ambient current, plus ripple impulses (petals are light)
    const k = Math.min(1, dt*0.9);
    p.vx += (cur.x - p.vx)*k + rp.dx*dt*11;
    p.vy += (cur.y - p.vy)*k + rp.dy*dt*11;
    // koi brushing underneath push petals aside
    for (const kf of kois){
      const dx = p.x - kf.x, dy = p.y - kf.y;
      const d = Math.hypot(dx, dy) + 0.001;
      const reach = kf.len * 0.38;
      if (d < reach){
        const push = (kf.cruise + kf.burst) * dt / d * (0.7 + kf.big * 0.8);
        p.vx += dx * push;
        p.vy += dy * push;
        p.rotV += (Math.random() - 0.5) * dt * 60;
      }
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += (p.rotV + rp.dx*4)*dt;
    // wrap around edges so the flow never empties the screen
    if (p.x < -m) p.x = innerWidth + m; else if (p.x > innerWidth + m) p.x = -m;
    if (p.y < -m) p.y = innerHeight + m; else if (p.y > innerHeight + m) p.y = -m;
    const bob = 1 + rp.h*0.08 + Math.sin(now*1.1 + p.phase)*0.03;
    p.el.style.transform =
      `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) ` +
      `rotate(${p.rot.toFixed(1)}deg) scale(${bob.toFixed(3)})`;
  }
}

}

    <ellipse cx="21.5" cy="12.5" rx="1.8" ry="2.3" fill="#181c1e" opacity=".72"/>
    <circle cx="21" cy="11.5" r="0.8" fill="white" opacity=".75"/>
    <ellipse cx="38.5" cy="12.5" rx="1.8" ry="2.3" fill="#181c1e" opacity=".72"/>
    <circle cx="38" cy="11.5" r="0.8" fill="white" opacity=".75"/>
    <!-- mouth -->
    <path d="M28.5 5.5 C29.5 7.5 30.5 7.5 31.5 5.5" stroke="rgba(0,0,0,0.16)" stroke-width="0.7" fill="none"/>
  `;
  return svg;
}
const kois = [];
// koi scale with the screen so they read well on phone and desktop alike
const KOI_SCALE = Math.min(1.1, Math.max(0.6, Math.min(innerWidth, innerHeight)/760));
const KOI_COUNT = Math.min(10, Math.max(7, Math.floor(innerWidth / 130)));
let koiUid = 0;
for (let i = 0; i < KOI_COUNT; i++){
  const variety = pick(KOI_VARIETIES);
  // mild bias toward smaller fish. t in [0,1] doubles as the "bigness"
  const t = Math.pow(Math.random(), 1.6);
  const len = (50 + t*100) * KOI_SCALE;           // ~50..150 css px on desktop (smaller & rounder)
  const big = t;
  const el = makeKoiEl(variety, "k" + (koiUid++));
  el.style.width  = (len*60/130) + "px";
  el.style.height = len + "px";
  // big koi ride near the surface: crisper & more opaque; small ones deeper
  el.style.opacity = (0.66 + big*0.28).toFixed(2);
  el.style.filter  = `blur(${(1.2 - big*1.0).toFixed(2)}px) saturate(${(0.9 + big*0.16).toFixed(2)}) drop-shadow(0 ${(2+big*3).toFixed(0)}px ${(3+big*3).toFixed(0)}px rgba(30,70,90,${(0.16+big*0.16).toFixed(2)}))`;
  el.style.zIndex  = "1";  // beneath pads(2), petals(2) & flowers(3)
  document.body.appendChild(el);
  kois.push({
    el, len, big,
    x: (0.12 + 0.76*Math.random())*innerWidth,
    y: (0.12 + 0.76*Math.random())*innerHeight,
    heading: 0, desired: 0,
    // small fish cruise faster & flee harder; big fish are calm
    cruise: 34 - big*16 + Math.random()*8,
    fright: 1.5 - big*0.9,                          // startle sensitivity
    burst: 0,
    maxTurn: 1.4,                                   // rad/s cap; spikes on startle
    turnV: 0, turnTarget: 0, turnT: 0,
    phase: Math.random()*Math.PI*2,
    leader: null,
    visDeg: null, tailBucket: 0,
  });
  const k0 = kois[kois.length-1];
  k0.heading = k0.desired = Math.random()*Math.PI*2;
}
// loose schooling: each small koi may follow a nearby larger koi
const bigKoi = kois.filter(k => k.big > 0.55);
for (const k of kois){
  if (k.big < 0.4 && bigKoi.length && Math.random() < 0.6){
    k.leader = bigKoi[(Math.random()*bigKoi.length)|0];
  }
}
function angDiff(a, b){
  let d = a - b;
  while (d >  Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return d;
}
function startleKoi(cx, cy){
  for (const k of kois){
    const d = Math.hypot(k.x - cx, k.y - cy);
    const reach = 520 * k.fright;              // small fish spook from farther
    if (d > reach) continue;
    // already bolting: skip so rapid successive taps don't yank heading.
    if (k.burst > 50) continue;
    // proximity weight: 1=near the tap, 0=far edge. Quadratic falloff so
    // distant fish barely twitch while nearby fish bolt hard.
    const w = 1 - d / reach;
    const wSq = w * w;
    const escapeH = Math.atan2(k.y - cy, k.x - cx) + (Math.random()-.5)*0.5;
    k.desired += angDiff(escapeH, k.desired) * wSq;
    // burst & turn-rate cap scale with proximity
    k.burst = Math.max(k.burst, (60 + 340 * wSq) * k.fright);
    k.maxTurn = 1.4 + wSq * 5.1;               // 1.4 (gentle) … 6.5 (whip)
    k.turnT = 0; k.turnV = 0; k.turnTarget = 0;
  }
}
function spawnKoi(){
  // pick a random off-screen edge and swim toward the centre
  const side = Math.random();
  let x, y;
  if (side < 0.25){       x = rnd(-80, innerWidth+80); y = -80; }
  else if (side < 0.5){   x = innerWidth+80; y = rnd(-80, innerHeight+80); }
  else if (side < 0.75){  x = rnd(-80, innerWidth+80); y = innerHeight+80; }
  else {                  x = -80; y = rnd(-80, innerHeight+80); }
  const targetX = innerWidth*0.3 + Math.random()*innerWidth*0.4;
  const targetY = innerHeight*0.3 + Math.random()*innerHeight*0.4;
  const variety = pick(KOI_VARIETIES);
  const t = Math.pow(Math.random(), 1.6);
  const len = (50 + t*100) * KOI_SCALE;
  const big = t;
  const el = makeKoiEl(variety, "k" + (koiUid++));
  el.style.width  = (len*60/130) + "px";
  el.style.height = len + "px";
  el.style.opacity = (0.66 + big*0.28).toFixed(2);
  el.style.filter  = `blur(${(1.2 - big*1.0).toFixed(2)}px) saturate(${(0.9 + big*0.16).toFixed(2)}) drop-shadow(0 ${(2+big*3).toFixed(0)}px ${(3+big*3).toFixed(0)}px rgba(30,70,90,${(0.16+big*0.16).toFixed(2)}))`;
  el.style.zIndex  = "1";
  document.body.appendChild(el);
  const heading = Math.atan2(targetY - y, targetX - x);
  kois.push({
    el, len, big,
    x, y,
    heading, desired: heading,
    cruise: 34 - big*16 + Math.random()*8,
    fright: 1.5 - big*0.9,
    burst: 0,
    maxTurn: 1.4,
    turnV: 0, turnTarget: 0, turnT: 0,
    phase: Math.random()*Math.PI*2,
    leader: null,
    visDeg: null, tailBucket: 0,
    grace: 2.5,
  });
}
function updateKoi(now, dt){
  for (const k of kois){
    // wander: angular velocity eases toward a target that retargets occasionally.
    // skip entirely while fleeing (burst>40); fade back in smoothly as burst decays.
    k.turnT -= dt;
    if (k.turnT <= 0){
      k.turnT = 1.5 + Math.random()*2.5;
      k.turnTarget = (Math.random()-.5)*0.8;
    }
    if (k.burst <= 40){
      k.turnV += (k.turnTarget - k.turnV) * Math.min(1, dt*1.2);
      const wFade = Math.min(1, (40 - k.burst) / 12);  // 0→1 as burst drops 40→28
      k.desired += k.turnV * dt * wFade;
    }
    // loose schooling: gently steer small fish toward their leader
    if (k.leader && k.burst < 40){
      const d = Math.hypot(k.leader.x - k.x, k.leader.y - k.y);
      if (d > 70){
        const want = Math.atan2(k.leader.y - k.y, k.leader.x - k.x);
        k.desired += angDiff(want, k.desired) * Math.min(1, dt*0.6);
      }
    }
    // keep personal space: steer away from fish that get too close (cruising only)
    if (k.burst <= 40){
      for (const other of kois){
        if (other === k || other.burst > 40) continue;
        const dx = k.x - other.x, dy = k.y - other.y;
        const d = Math.hypot(dx, dy) + 1;
        const minDist = (k.len + other.len) * 0.28;
        if (d < minDist){
          k.desired += angDiff(Math.atan2(dy, dx), k.desired) * Math.min(1, dt*0.8);
        }
      }
    }
    // new fish: strong pull toward screen centre until grace expires
    if (k.grace > 0){
      const centerH = Math.atan2(innerHeight/2 - k.y, innerWidth/2 - k.x);
      k.desired += angDiff(centerH, k.desired) * Math.min(1, dt * 2.5);
    }
    // very gentle edge avoidance — fish can still leave, but they prefer not to
    const em = 50;
    if (k.x < em || k.x > innerWidth-em || k.y < em || k.y > innerHeight-em){
      const want = Math.atan2(innerHeight/2 - k.y, innerWidth/2 - k.x);
      k.desired += angDiff(want, k.desired) * Math.min(1, dt * 0.35);
    }
    // physical heading chases the desired heading under a turn-rate cap
    // fleeing fish weave slightly for a more natural escape path
    if (k.burst > 40){
      k.desired += Math.sin(now * 4.5 + k.phase) * dt * 1.2;
    }
    const dh = angDiff(k.desired, k.heading);
    const step = Math.max(-k.maxTurn*dt, Math.min(k.maxTurn*dt, dh));
    k.heading += step;
    const turnRate = step / Math.max(dt, 1e-4);
    k.maxTurn += (1.4 - k.maxTurn) * Math.min(1, dt*1.8);  // relax after startle
    k.burst *= Math.exp(-dt*1.4);
    const sp = k.cruise + k.burst;
    k.x += Math.cos(k.heading)*sp*dt;
    k.y += Math.sin(k.heading)*sp*dt;
    // fish that swim far off-screen are removed, making room for new ones
    if (k.grace > 0) { k.grace -= dt; }
    else {
      const OM = 140;
      if (k.x < -OM || k.x > innerWidth+OM || k.y < -OM || k.y > innerHeight+OM) k.dead = true;
    }
    // a fleeing koi churns the surface; big koi also nudge it at cruise
    if (k.burst > 70 && Math.random() < dt*7) addDrop(k.x, k.y, 11, 0.14);
    else if (k.big > 0.6 && Math.random() < dt*0.5) addDrop(k.x, k.y, 13, 0.05);
    // tail beat follows speed (quantised so the CSS animation isn't restarted every frame)
    const dur = Math.max(0.28, Math.min(1.15, 26/sp));
    const bucket = Math.round(dur*10);
    if (bucket !== k.tailBucket){
      k.tailBucket = bucket;
      k.el.style.setProperty("--td", (bucket/10) + "s");
    }
    // visual angle smoothly tracks physics; banking leans into turns;
    // a slight lateral wiggle breaks the "sliding on rails" look
    const targetDeg = k.heading*180/Math.PI + 90;
    if (k.visDeg === null) k.visDeg = targetDeg;
    let vd = targetDeg - k.visDeg;
    vd = ((vd + 540) % 360) - 180;
    k.visDeg += vd * Math.min(1, dt*9);
    const rawBank = Math.max(-16, Math.min(16, turnRate*10));
    if (k.smoothBank === undefined) k.smoothBank = 0;
    k.smoothBank += (rawBank - k.smoothBank) * Math.min(1, dt*8);
    const bank = k.smoothBank;
    const wig = Math.sin(now*(4 + k.cruise*0.05) + k.phase) * (1.2 + k.len*0.015);
    const px = k.x + Math.cos(k.heading + Math.PI/2)*wig;
    const py = k.y + Math.sin(k.heading + Math.PI/2)*wig;
    const w = k.len*60/130;
    k.el.style.transform =
      `translate(${(px - w/2).toFixed(1)}px, ${(py - k.len/2).toFixed(1)}px) ` +
      `rotate(${(k.visDeg + bank).toFixed(1)}deg)`;
  }
  // remove dead koi and spawn replacements to keep count within KOI_COUNT ±2
  for (let i = kois.length-1; i >= 0; i--){
    if (kois[i].dead){ kois[i].el.remove(); kois.splice(i,1); }
  }
  while (kois.length < KOI_COUNT - 1) spawnKoi();
}

/* ================= main loop ================= */
const uSim = {
  uCur:   gl.getUniformLocation(simProg, "uCur"),
  uPrev:  gl.getUniformLocation(simProg, "uPrev"),
  uTexel: gl.getUniformLocation(simProg, "uTexel"),
  uDrops: gl.getUniformLocation(simProg, "uDrops"),
  uDropCount: gl.getUniformLocation(simProg, "uDropCount"),
  uDamp:  gl.getUniformLocation(simProg, "uDamp"),
};
const uRen = {
  uHeight:  gl.getUniformLocation(renProg, "uHeight"),
  uBg:      gl.getUniformLocation(renProg, "uBg"),
  uTexel:   gl.getUniformLocation(renProg, "uTexel"),
  uRes:     gl.getUniformLocation(renProg, "uRes"),
  uBgScale: gl.getUniformLocation(renProg, "uBgScale"),
  uTime:    gl.getUniformLocation(renProg, "uTime"),
};

const MAX_DROPS = 8;
const dropArr = new Float32Array(MAX_DROPS * 4);
function simStep(batch){
  gl.useProgram(simProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bufNext.fbo);
  gl.viewport(0, 0, simW, simH);
  bindQuad(simProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bufCur.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bufPrev.tex);
  gl.uniform1i(uSim.uCur, 0);
  gl.uniform1i(uSim.uPrev, 1);
  gl.uniform2f(uSim.uTexel, 1/simW, 1/simH);
  gl.uniform1f(uSim.uDamp, 0.986);
  const n = batch ? Math.min(batch.length, MAX_DROPS) : 0;
  for (let i = 0; i < n; i++){
    const d = batch[i];
    dropArr[i*4] = d.x; dropArr[i*4+1] = d.y; dropArr[i*4+2] = d.r; dropArr[i*4+3] = d.s;
  }
  gl.uniform1i(uSim.uDropCount, n);
  if (n) gl.uniform4fv(uSim.uDrops, dropArr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // rotate: prev <- cur, cur <- next, next <- old prev
  const tmp = bufPrev; bufPrev = bufCur; bufCur = bufNext; bufNext = tmp;
}

let lastT = performance.now();
function frame(){
  requestAnimationFrame(frame);
  const nowMs = performance.now();
  let dt = (nowMs - lastT) / 1000;
  lastT = nowMs;
  dt = Math.min(dt, 0.05);
  const now = nowMs / 1000;

  // fixed substeps for stable, frame-rate independent waves.
  // all queued drops are injected on the first substep so fast strokes
  // never lose ripples and stroke speed doesn't alter wave velocity.
  const steps = Math.max(1, Math.min(3, Math.round(dt / 0.0166)));
  for (let i = 0; i < steps; i++){
    simStep(i === 0 && drops.length ? drops : null);
  }
  drops.length = 0;

  // render
  gl.useProgram(renProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  bindQuad(renProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bufCur.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.uniform1i(uRen.uHeight, 0);
  gl.uniform1i(uRen.uBg, 1);
  gl.uniform2f(uRen.uTexel, 1/simW, 1/simH);
  gl.uniform2f(uRen.uRes, W, H);
  // cover-fit the photo
  let sx = 1, sy = 1;
  if (bgReady){
    const sAsp = W / H, iAsp = bgW / bgH;
    if (sAsp > iAsp) sy = iAsp / sAsp; else sx = sAsp / iAsp;
  }
  gl.uniform2f(uRen.uBgScale, sx, sy);
  gl.uniform1f(uRen.uTime, now);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  updateFlowers(now);
  updatePads(now, dt);
  updatePetals(now, dt);
  updateKoi(now, dt);
}
requestAnimationFrame(frame);

// a welcoming ripple
setTimeout(() => addDrop(innerWidth*0.5, innerHeight*0.45, 30, 1.1), 600);
</script>
